services:
  openmaic:
    build:
      context: .
      args:
        # 国内镜像加速（可选，注释掉则使用默认 Docker Hub）
        # DOCKER_REGISTRY: registry.cn-hangzhou.aliyuncs.com/mirrorx
    ports:
      - "80:3000"
    env_file:
      - .env.local
    volumes:
      # Optional: mount server-providers.yml for provider config
      # - ./server-providers.yml:/app/server-providers.yml:ro
      - openmaic-data:/app/data
    restart: unless-stopped

volumes:
  openmaic-data:
